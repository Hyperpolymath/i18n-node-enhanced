# SPDX-License-Identifier: MPL-2.0
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    name: Test Before Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          deno-version: v2.x
      - name: Build (ReScript -> JS)
        run: deno task build
      - name: Test
        run: deno task test

  publish-jsr:
    name: Publish to JSR
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      id-token: write   # JSR records build provenance from this
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          deno-version: v2.x
      - name: Build (ReScript -> JS)
        run: deno task build
      - name: Publish to JSR
        run: deno publish

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish-jsr
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
